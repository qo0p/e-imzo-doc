services:
  vault:
    build: ./vault
    container_name: e-imzo-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    env_file:
      - vault.env
    volumes:
      - vault-token:/run/vault-token
    networks:
      - eimzo_lan

  server:
    build: ./server
    container_name: e-imzo-server
    restart: unless-stopped
    environment:
      JAVA_OPTS: ""
    volumes:
      - ./server/config.properties:/opt/e-imzo-server/config/config.properties:ro
      - ./server/logging.properties:/opt/e-imzo-server/config/logging.properties:ro
      - ./server/keys:/opt/e-imzo-server/keys
    networks:
      - eimzo_lan

  client:
    build: ./client
    container_name: e-imzo-client
    restart: unless-stopped
    network_mode: "service:proxy"
    volumes:
      - ./client:/var/www/html
    depends_on:
      - proxy

  proxy:
    build: ./proxy
    container_name: e-imzo-proxy
    restart: unless-stopped
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /run/vault-token/nginx-token
      VAULT_SECRET_PATH: secret/data/eimzo/api-keys
      VAULT_REFRESH_INTERVAL: "300"
    ports:
      - "8082:8082"
    volumes:
      - vault-token:/run/vault-token:ro
    networks:
      - eimzo_lan
    depends_on:
      vault:
        condition: service_healthy
      server:
        condition: service_started

networks:
  eimzo_lan:
    driver: bridge

volumes:
  vault-token:
