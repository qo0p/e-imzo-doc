user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 20m;

    upstream eimzo_client {
        server client:80;
    }

    upstream eimzo_server {
        server server:8080;
    }

    # Public: the only published server (host port 8082)
    server {
        listen 80;
        server_name _;

        # E-IMZO API keys from Vault
        location = /api-keys.json {
            alias /etc/nginx/eimzo/api-keys.json;
            default_type application/json;
            add_header Cache-Control "no-store";
        }

        # /frontend methods of E-IMZO-SERVER are allowed for the browser
        location /frontend/ {
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://eimzo_server;
        }

        # /backend methods must never be reachable from outside
        location /backend/ {
            return 404;
        }

        location / {
            proxy_set_header Host            $http_host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://eimzo_client;
        }
    }

    # Internal: client (PHP backend) -> proxy -> E-IMZO-SERVER. Not published.
    server {
        listen 8080;
        server_name _;

        location / {
            # Host and X-Real-IP are set by the PHP backend (user's domain and IP)
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_pass http://eimzo_server;
        }
    }
}
