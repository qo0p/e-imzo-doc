user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 20m;

    # Slow down scanners / brute force
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    limit_req_zone  $binary_remote_addr zone=site:10m    rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=apikeys:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---- Bots / HTTP tools (curl, Postman, Fiddler, scripts, crawlers) ----
    map $http_user_agent $bad_ua {
        default 0;
        ""      1;
        "~*(curl|wget|postman|insomnia|httpie|fiddler|charles|burp|zap|sqlmap|nikto|nmap|masscan|zgrab|python|aiohttp|go-http-client|java/|okhttp|apache-httpclient|libwww|perl|ruby|php/|node-fetch|axios|undici|powershell|winhttp|scrapy|headless|phantomjs|selenium|puppeteer|playwright|bot|crawl|spider|slurp)" 1;
    }

    # ---- /api-keys.json: only a same-origin XHR from a real browser ----
    # Browsers set Sec-Fetch-* themselves (JS cannot change them).
    map $http_sec_fetch_site $sfs_ok { same-origin 1; default 0; }
    map $http_sec_fetch_mode $sfm_ok { cors 1; same-origin 1; default 0; }
    map $http_sec_fetch_dest $sfd_ok { empty 1; default 0; }
    map $http_x_requested_with $xrw_ok { XMLHttpRequest 1; default 0; }
    map "$bad_ua:$sfs_ok:$sfm_ok:$sfd_ok:$xrw_ok:$request_method" $keys_request_ok {
        "0:1:1:1:1:GET" 1;
        default         0;
    }

    # client (Apache) shares the proxy's network namespace -> localhost:80
    upstream eimzo_client {
        server 127.0.0.1:80;
    }

    upstream eimzo_server {
        server server:8080;
    }

    # Public: the only published server (host port 8082)
    server {
        listen 8082 default_server;
        server_name _;

        limit_conn perip 30;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        same-origin always;

        if ($request_method !~ ^(GET|POST|HEAD)$) {
            return 405;
        }

        # Docker HEALTHCHECK only (from inside the container)
        location = /healthz {
            # `return` runs before allow/deny, so filter by address here
            if ($remote_addr != "127.0.0.1") {
                return 404;
            }
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # E-IMZO API keys from Vault — only for the client page
        location = /api-keys.json {
            limit_req zone=apikeys burst=5 nodelay;

            # 444 = close the connection without a response
            if ($keys_request_ok = 0) {
                return 444;
            }

            alias /etc/nginx/eimzo/api-keys.json;
            default_type application/json;
            add_header Cache-Control "no-store, private" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Config files are not reachable from outside
        location ~ /config\.php$ {
            return 404;
        }
        location ~ /\. {
            return 404;
        }

        # The E-IMZO mobile app uploads signed data here (non-browser UA)
        location /frontend/mobile/upload {
            limit_req zone=site burst=20 nodelay;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://eimzo_server;
        }

        # /frontend methods of E-IMZO-SERVER are allowed for the browser
        location /frontend/ {
            limit_req zone=site burst=40 nodelay;
            if ($bad_ua) {
                return 444;
            }
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://eimzo_server;
        }

        # /backend methods must never be reachable from outside
        location /backend/ {
            return 404;
        }

        location / {
            limit_req zone=site burst=40 nodelay;
            if ($bad_ua) {
                return 444;
            }
            proxy_set_header Host            $http_host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://eimzo_client;
        }
    }
}
